name: publish-nuget

# 推送 v* 格式 tag 时触发。本仓库有两条独立版本线（DataGrid 系 / TreeDataGrid 系），
# 标签以 DataGrid 的 <DataGridPackageVersion> 为参照，一次发布四个包；
# 未升版本的包会被 nuget.org 以 --skip-duplicate 跳过。
# 打 tag 前先升版本：nuget.org 拒绝重复的版本号。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # NuGet Trusted Publishing：用 OIDC 令牌换取一次性发布凭据

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          # 目标框架 net8.0 / net10.0 / net11.0，11.0 为 preview SDK
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Check tag matches package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $props = Get-Content -LiteralPath Directory.Build.props -Raw -Encoding UTF8
          if ($props -match '<DataGridPackageVersion>([^<]+)</DataGridPackageVersion>') {
            $packageVersion = $Matches[1].Trim()
            if ($tagVersion -ne $packageVersion) {
              Write-Host "::warning::Tag ($tagVersion) 与 DataGridPackageVersion ($packageVersion) 不一致，本次将以 props 中的版本发布。"
            }
          } else {
            Write-Host "::warning::未在 Directory.Build.props 中找到 DataGridPackageVersion。"
          }

      - name: Build
        shell: pwsh
        run: |
          # 与 pack.bat 一致：先构建解决方案（隐式 restore）
          dotnet build CodeWF.AvaloniaControls.DataGrid.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Pack
        shell: pwsh
        run: |
          # 只 pack 四个库项目，Demo / Test 不参与；
          # .NET 11 SDK 的 pack 不再隐式构建，须先 Build 再 --no-build Pack
          $projects = @(
            'src/CodeWF.AvaloniaControls.DataGrid/CodeWF.AvaloniaControls.DataGrid.csproj',
            'src/CodeWF.AvaloniaControls.DataGrid.Themes/CodeWF.AvaloniaControls.DataGrid.Themes.csproj',
            'src/CodeWF.AvaloniaControls.TreeDataGrid/CodeWF.AvaloniaControls.TreeDataGrid.csproj',
            'src/CodeWF.AvaloniaControls.TreeDataGrid.Themes/CodeWF.AvaloniaControls.TreeDataGrid.Themes.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }

          Get-ChildItem artifacts/packages | ForEach-Object { Write-Host $_.Name }

      - name: NuGet login (Trusted Publishing)
        uses: nuget/login@v1
        id: login
        with:
          user: dotnet9

      - name: Push to nuget.org
        shell: pwsh
        run: |
          # 主包：失败即中止；未升版本的包被 nuget.org 拒绝时由 --skip-duplicate 跳过
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $($_.Name)" }
          }

          # 符号包：不含 pdb 的 snupkg 会被 nuget.org 拒绝，仅告警不中止
          Get-ChildItem artifacts/packages -Filter *.snupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { Write-Host "warning: symbol package push failed: $($_.Name)" }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
